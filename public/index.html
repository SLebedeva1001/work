<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4f1" />
    <title>Распределение поставщиков</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <h1>Распределение поставщиков</h1>
          <p class="subtitle">BABY TREND · ЗАКУПКИ · ПЕРЕТАЩИТЕ КАРТОЧКУ В НУЖНУЮ КОЛОНКУ</p>
        </div>
        <form id="supplier-form" aria-label="Добавить поставщика">
          <input id="supplier-name" name="name" maxlength="160" placeholder="Новый поставщик…" required />
          <select id="manager-select" name="manager">
            <option value="lebedeva">Лебедева</option>
            <option value="terekhova">Терехова</option>
            <option value="kuznetsova">Кузнецова</option>
          </select>
          <button class="add-button" type="submit">Добавить</button>
          <button class="export-button" id="export-button" type="button">Скачать Excel</button>
          <button class="column-button" id="column-button" type="button">+ Колонка</button>
        </form>
      </header>

      <div class="sync-status" id="sync-status" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span>Загрузка…</span>
      </div>

      <section class="board" id="board" aria-label="Канбан-доска"></section>
    </main>
    <div class="toast" id="toast" role="alert"></div>
    <dialog class="app-dialog" id="app-dialog">
      <form method="dialog" id="dialog-form">
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <input id="dialog-input" maxlength="160" />
        <div class="supplier-edit-fields">
          <label class="dialog-field">
            <span>Передать менеджеру</span>
            <select id="dialog-manager"></select>
          </label>
          <label class="dialog-contract">
            <input id="dialog-contract" type="checkbox" />
            <span>К — контракт</span>
          </label>
        </div>
        <div class="dialog-actions">
          <button class="dialog-cancel" value="cancel">Отмена</button>
          <button class="dialog-confirm" id="dialog-confirm" value="confirm">Сохранить</button>
        </div>
      </form>
    </dialog>
    <script src="./app.js" defer></script>
  </body>
</html>
